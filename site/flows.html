<!doctype html>
<html lang="en">
<head>

<title>Bybit Flow Counterparties</title>
<meta name="description" content="Who moves xStocks between Bybit and Mantle: market makers, arbitrage and institutions vs retail, inferred from on-chain behavior.">
<style>

@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#fff; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --ring:rgba(255,255,255,.10); --hover:rgba(255,255,255,.05);

  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0d0d0d; --surface:#1a1a19; --ink:#fff; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --ring:rgba(255,255,255,.10); --hover:rgba(255,255,255,.05);

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
a:focus-visible,button:focus-visible{outline:2px solid var(--mm);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:24px 16px 64px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px}

.tile{background:var(--surface);border:1px solid var(--ring);border-radius:12px;padding:14px 16px;box-shadow:inset 0 3px 0 var(--c)}
.tile .k{color:var(--ink-2);font-size:13px}
.tile .v{font-size:24px;font-weight:620;margin-top:4px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}

.bar{display:flex;height:14px;border-radius:3px;overflow:hidden;background:var(--unk-bg);min-width:60px}
.bar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--ink-2);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.tablewrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;vertical-align:top}
th{color:var(--muted);font-weight:550;font-size:12px;white-space:nowrap}
th.l,td.l{text-align:left}
td.nw{white-space:nowrap}
.small{display:block;color:var(--muted);font-size:12px}
.mono{font-family:ui-monospace,Menlo,monospace}
.why{text-align:left;color:var(--ink-2);min-width:260px;max-width:440px}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap}
.chip.mm{background:var(--mm-bg);color:var(--mm)} .chip.retail{background:var(--retail-bg);color:var(--retail)} .chip.unknown{background:var(--unk-bg);color:var(--ink-2)}
.barcell{width:30%;vertical-align:middle}
.empty{color:var(--muted);padding:24px 0;text-align:center}
footer{color:var(--muted);font-size:12px;margin-top:24px;line-height:1.7}
@media (prefers-reduced-motion:no-preference){.bar span{transition:width .25s}}
</style>

<body>
<div class="wrap">
  <header>
    <div>

};
const qsLang = new URLSearchParams(location.search).get("lang");
let saved = null; try { saved = localStorage.getItem("fluxmon.lang"); } catch (e) {}

function compact(v) {
  const a = Math.abs(v);
  if (a >= 1e6) return (v / 1e6).toFixed(2) + "M";
  if (a >= 1e4) return (v / 1e3).toFixed(1) + "K";
  if (a >= 1e3) return (v / 1e3).toFixed(2) + "K";

}

const short = a => a.slice(0, 6) + "…" + a.slice(-4);
const el = (tag, attrs = {}, ...kids) => { const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k === "class" ? e.className = v : k === "text" ? e.textContent = v : e.setAttribute(k, v);
  for (const k of kids) if (k != null) e.append(k); return e; };
const COLOR = { mm: "var(--mm)", retail: "var(--retail)", unknown: "var(--unk)" };

  return b; };

function applyStatic() {
  document.documentElement.lang = LANG === "zh" ? "zh-CN" : "en";
  document.title = T().docTitle;
  for (const e of document.querySelectorAll("[data-i18n]")) e.textContent = T()[e.dataset.i18n];
  for (const b of document.querySelectorAll("#f-lang button")) b.setAttribute("aria-pressed", b.dataset.v === LANG);

function render() {
  const D = state.data;
  if (!D) return;

  $("#share").replaceChildren(el("h2", { text: T().shareTitle }), el("p", { class: "desc", text: T().shareDesc(state.win) }),
    totN ? share : el("div", { class: "empty", text: T().noData }), legend);

        el("td", { text: v.entities }), el("td", { text: v.flows }), el("td", { text: usd(v.usd) }), el("td", { text: pct(v.usd, tot30).toFixed(1) + "%" })))))) : el("div", { class: "empty", text: T().noData }));

      el("thead", {}, el("tr", {}, ...[["l", T().cEntity], ["l", T().cClass], ["", T().cWd], ["", T().cDp], ["", T().cNonce], ["", T().cSyms], ["l", T().cWhy]].map(([c, t]) => el("th", { class: c, text: t })))),
      el("tbody", {}, ...ents.map(e => {
        const extra = e.members.length - 1;
        return el("tr", {},
          el("td", { class: "l nw" }, el("a", { class: "mono", href: EXPLORER + e.entity, target: "_blank", rel: "noopener", text: short(e.entity) }),
            extra > 0 ? el("span", { class: "small", text: T().linked(extra, e.deposit_addrs.length > 0) }) : null),
          el("td", { class: "l nw" }, el("span", { class: "chip " + e.class, text: T().cls[e.class] }), e.sub ? el("span", { class: "small", text: T().sub[e.sub] || e.sub }) : null),

          el("td", { class: "why", text: e.why.map(w => (T().why[w.code] || (() => w.code))(w)).join(LANG === "zh" ? "；" : "; ") }));
      })))) : el("div", { class: "empty", text: T().noData }));

  const syms = Object.entries(D.by_symbol || {}).map(([s, v]) => [s, v, CLASSES.reduce((a, c) => a + (v[c] || 0), 0)]).sort((a, b) => b[2] - a[2]);
  $("#symbols").replaceChildren(el("h2", { text: T().symTitle }), el("p", { class: "desc", text: T().symDesc }),
    syms.length ? el("div", { class: "tablewrap" }, el("table", {},
      el("thead", {}, el("tr", {}, el("th", { class: "l", text: T().cSym }), el("th", { text: T().cTotal }), ...CLASSES.map(c => el("th", { text: T().cls[c] })), el("th", { class: "l", text: T().cMix }))),
      el("tbody", {}, ...syms.map(([s, v, t]) => el("tr", {}, el("td", { class: "l", text: s }), el("td", { text: usd(t) }),
        ...CLASSES.map(c => el("td", { text: v[c] ? usd(v[c]) : "–" })), el("td", { class: "barcell" }, bar(CLASSES.map(c => [c, pct(v[c] || 0, t)])))))))) : el("div", { class: "empty", text: T().noData }));
}

async function load() {
  try {
    const r = await fetch("data/counterparties.json?t=" + Math.floor(Date.now() / 60000));
    if (!r.ok) throw new Error("HTTP " + r.status);
    state.data = await r.json(); render();
  } catch (e) { $("#meta").textContent = T().loadFail + e.message; }
}
$("#f-win").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return;
  for (const x of $("#f-win").querySelectorAll("button")) x.setAttribute("aria-pressed", x === b);
  state.win = b.dataset.v; render(); });
$("#f-lang").addEventListener("click", e => { const b = e.target.closest("button"); if (!b || b.dataset.v === LANG) return;
  LANG = b.dataset.v; try { localStorage.setItem("fluxmon.lang", LANG); } catch (err) {}
  applyStatic(); render(); });
applyStatic(); load(); setInterval(load, 5 * 60 * 1000);
})();
